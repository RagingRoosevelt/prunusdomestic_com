services:
  jekyll:
    image: jekyll/jekyll
    volumes:
      - './:/srv/jekyll'
      # Named volume so the ~98 github-pages gems survive `--rm` instead of
      # being re-downloaded on every build.
      - 'bundle:/usr/gem'
    ports:
      # 8000/35730 rather than Jekyll's 4000/35729 defaults, so this can run
      # alongside another Jekyll site without fighting over ports.
      - '8000:8000'
      - '35730:35730'
    # `bundle exec` so the Gemfile's github-pages pins win over the Jekyll
    # baked into the image (4.2.2), which is not the version GitHub Pages runs.
    # `bundle check ||` makes the gem volume self-populating on a fresh clone.
    # No --incremental: a page's title suffix comes from its section index's
    # front matter, and incremental only re-renders files whose own source
    # changed, so it serves stale titles. A full build is under a second.
    # Its own --destination: `jekyll serve` rewrites site.url to the dev
    # address, so sharing _site with `make build` meant whichever ran last won
    # and the checks could read canonical URLs pointing at 0.0.0.0.
    command: sh -lc 'bundle check || bundle install; bundle exec jekyll serve --host 0.0.0.0 --port 8000 --livereload --livereload-port 35730 --force_polling --destination /srv/jekyll/_site_dev'

volumes:
  bundle:
