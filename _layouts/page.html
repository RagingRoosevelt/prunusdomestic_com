---
layout: base
---
{%- assign parent = site.pages | where: "section", page.section | first %}
      <nav aria-label="breadcrumb">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="{{ parent.url }}">{{ parent.title }}</a></li>
          <li><a aria-current="page">{{ page.title }}</a></li>
        </ul>
      </nav>
      <article>
        <h1>{{ page.title }}</h1>
{%- if page.images %}
{%- include carousel.html images=page.images %}
{%- endif %}
{{ content }}
      </article>
